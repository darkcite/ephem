[workspace]
resolver = "2"
members = ["crates/proto", "crates/crypto", "crates/core", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/darkcite/ephem"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Argon2id (19 MiB, t = 4) is unbearably slow unoptimized; keep native tests fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
