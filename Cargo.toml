[workspace]
resolver = "2"
members = ["crates/proto", "crates/crypto", "crates/core", "crates/snowflake", "crates/tor", "crates/wasm", "crates/channel", "crates/channel-web", "crates/board", "crates/pow"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/darkcite/ephem"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Argon2id (19 MiB, t = 4) is unbearably slow unoptimized; keep native tests fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# Boards sign and verify tens of thousands of posts in their tests (BD-1).
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.equix]
opt-level = 3
[profile.dev.package.hashx]
opt-level = 3

# Small browser patches of arti 0.46 (vendor/README.md): in-memory state (arti-client,
# tor-persist), directory store (tor-dirmgr) and replay logs (tor-hsservice) on wasm32,
# where upstream has `unimplemented!()`, SQLite or files.
[patch.crates-io]
arti-client = { path = "vendor/arti-client" }
tor-dirmgr = { path = "vendor/tor-dirmgr" }
tor-persist = { path = "vendor/tor-persist" }
tor-hsservice = { path = "vendor/tor-hsservice" }

# The boards' PoW solver runs in posters' Workers: speed over size (spike B-P1 used opt-level 3).
[profile.release.package.ephem-pow]
opt-level = 3
[profile.release.package.equix]
opt-level = 3
[profile.release.package.hashx]
opt-level = 3
