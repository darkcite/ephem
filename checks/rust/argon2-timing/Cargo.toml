[package]
name = "argon2-timing"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
