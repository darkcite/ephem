[package]
name = "wasm-sizes"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
noise = ["dep:snow"]
keyfile = ["dep:argon2", "dep:chacha20poly1305", "dep:hkdf", "dep:blake2", "dep:ed25519-dalek", "dep:x25519-dalek"]
qr = ["dep:qrcode", "dep:rqrr", "dep:image"]
mls = ["dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_basic_credential"]

[dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
snow = { version = "0.10", optional = true, default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
argon2 = { version = "0.5", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }
blake2 = { version = "0.10", optional = true }
ed25519-dalek = { version = "2", optional = true }
x25519-dalek = { version = "2", optional = true, features = ["static_secrets"] }
qrcode = { version = "0.14", optional = true, default-features = false }
rqrr = { version = "0.9", optional = true }
image = { version = "0.25", optional = true, default-features = false }
openmls = { version = "0.7", optional = true, features = ["js"] }
openmls_rust_crypto = { version = "0.4", optional = true }
openmls_basic_credential = { version = "0.4", optional = true }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
