<meta charset="utf-8">
<title>Ephem Tor lab</title>
<pre id="log"></pre>
<script type="module">
// Browser half of E4 (docs/P2P-CHAT.md Appendix C.5): tor_bg.wasm bootstraps through the lab's
// Snowflake broker/proxy/bridge over real WebRTC, then reaches the lab onion. Driven by
// checks/tor-lab/e2e_tor.mjs, which passes the lab parameters to window.run().
import init, { TorNet, tor_log } from './pkg/tor.js';
const log = (t) => { document.getElementById('log').textContent += t + '\n'; };
window.run = async ({ broker, fp, stun, nat, net, onion, port, level }) => {
  const t0 = performance.now();
  const ms = () => Math.round(performance.now() - t0);
  const out = { steps: [] };
  try {
    await init();
    tor_log(level || 'info');
    const tor = new TorNet(broker, fp, stun, nat, net);
    const timer = setInterval(() => console.log('status: ' + tor.status()), 5000);
    await Promise.race([tor.bootstrap(), new Promise((_, no) => setTimeout(() => no(new Error('bootstrap timeout: ' + tor.status())), 180000))]);
    clearInterval(timer);
    out.bootstrapMs = ms();
    out.steps.push(`bootstrapped ${out.bootstrapMs} ms: ${tor.status()}`);
    let s = null;
    for (let i = 0; !s; i++) {
      try { s = await tor.connect(onion, port); } catch (e) {
        if (ms() > 120000) throw e;
        out.steps.push(`connect: ${e}`);
        await new Promise((r) => setTimeout(r, 2000));
      }
    }
    out.connectMs = ms();
    const msg = new TextEncoder().encode('ephem in the browser over tor');
    await s.write(msg);
    let got = new Uint8Array();
    while (got.length < msg.length) {
      const b = await s.read(1024);
      if (!b.length) break;
      got = new Uint8Array([...got, ...b]);
    }
    out.echo = new TextDecoder().decode(got);
    out.echoMs = ms();
    out.ok = out.echo === 'ephem in the browser over tor';
  } catch (e) {
    out.error = String(e);
  }
  out.steps.forEach(log);
  log(JSON.stringify(out));
  return out;
};

// E5: tab hosts an onion service (tab A) / dials another tab's onion (tab B).
const enc = new TextEncoder(), dec = new TextDecoder();
async function start({ broker, fp, stun, nat, net, level }) {
  await init();
  tor_log(level || 'info');
  const tor = new TorNet(broker, fp, stun, nat, net);
  await Promise.race([tor.bootstrap(), new Promise((_, no) => setTimeout(() => no(new Error('bootstrap timeout: ' + tor.status())), 180000))]);
  return tor;
}
async function readN(s, n) {
  let got = new Uint8Array();
  while (got.length < n) {
    const b = await s.read(1024);
    if (!b.length) break;
    got = new Uint8Array([...got, ...b]);
  }
  return dec.decode(got);
}
window.hostTab = async (a) => {
  const t0 = performance.now();
  const tor = await start(a);
  const key = crypto.getRandomValues(new Uint8Array(32));
  const onion = tor.host('ephemlab', key);
  window.served = (async () => {
    const s = await tor.accept();
    const req = await readN(s, 4);
    await s.write(enc.encode(req === 'ping' ? 'pong' : 'what'));
    return req;
  })();
  return { onion, ms: Math.round(performance.now() - t0) };
};
window.dialTab = async (a, onion) => {
  const t0 = performance.now();
  const tor = await start(a);
  const steps = [];
  let s = null;
  while (!s) {
    try { s = await tor.connect(onion, 1); } catch (e) {
      if (performance.now() - t0 > 240000) return { error: String(e), steps };
      steps.push(String(e).slice(0, 120));
      await new Promise((r) => setTimeout(r, 3000));
    }
  }
  await s.write(enc.encode('ping'));
  const reply = await readN(s, 4);
  return { reply, ms: Math.round(performance.now() - t0), steps };
};

// B-P5 (docs/BOARDS.md G.16): uploads of board-post size to an onion hosted by another tab.
// Each upload is a new stream: 4-byte big-endian length, the body, then the host answers "ok"
// once it has every byte (it only counts them: nothing is kept).
window.hostSink = async (a) => {
  const tor = await start(a);
  const onion = tor.host('ephemsink', crypto.getRandomValues(new Uint8Array(32)));
  (async () => {
    for (;;) {
      const s = await tor.accept();
      (async () => {
        let head = new Uint8Array(), need = -1, got = 0;
        for (;;) {
          const b = await s.read(65536);
          if (!b.length) return;
          if (need < 0) {
            head = new Uint8Array([...head, ...b]);
            if (head.length < 4) continue;
            need = new DataView(head.buffer).getUint32(0);
            got = head.length - 4;
          } else got += b.length;
          if (got >= need) return s.write(enc.encode('ok'));
        }
      })();
    }
  })();
  return { onion };
};
window.uploads = async (a, onion, sizes, reps) => {
  const tor = await start(a);
  const out = [];
  for (const size of sizes) {
    for (let r = 0; r < reps; r++) {
      const body = new Uint8Array(4 + size);
      new DataView(body.buffer).setUint32(0, size);
      crypto.getRandomValues(body.subarray(4, Math.min(body.length, 4 + 65536)));
      const t0 = performance.now();
      try {
        let s = null;
        for (let i = 0; !s; i++) {
          try { s = await tor.connect(onion, 80); } catch (e) { if (i > 40) throw e; await new Promise((z) => setTimeout(z, 3000)); }
        }
        const t1 = performance.now();
        await s.write(body);
        const reply = await readN(s, 2);
        const t2 = performance.now();
        out.push({ size, open: Math.round(t1 - t0), send: Math.round(t2 - t1), ok: reply === 'ok' });
      } catch (e) {
        out.push({ size, error: String(e).slice(0, 160) });
      }
    }
  }
  return out;
};
</script>
