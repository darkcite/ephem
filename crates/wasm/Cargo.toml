[package]
name = "ephem-wasm"
description = "Ephem browser adapter: the only crate touching the browser (web-sys WebRTC, JS events)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
ephem-proto = { path = "../proto" }
ephem-crypto = { path = "../crypto" }
ephem-core = { path = "../core" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
qrcode = { version = "0.14", default-features = false }
web-sys = { version = "0.3", features = [
  "Window",
  "RtcConfiguration",
  "RtcIceServer",
  "RtcBundlePolicy",
  "RtcIceTransportPolicy",
  "RtcPeerConnection",
  "RtcPeerConnectionState",
  "RtcIceGatheringState",
  "RtcPeerConnectionIceEvent",
  "RtcIceCandidate",
  "RtcDataChannel",
  "RtcDataChannelInit",
  "RtcDataChannelType",
  "RtcSdpType",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
  "MessageEvent",
] }
