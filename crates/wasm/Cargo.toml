[package]
name = "ephem-wasm"
description = "Ephem browser adapter: the only crate touching the browser (web-sys WebRTC, JS events)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Tor build (app/pkg/ephem_tor*, §28.2): chat links over Tor streams (the WebRTC chat transport
# is refused, §28.5), and public channels (ChannelApp, Appendix F.3.3), which the direct page
# also loads for its channel tabs.
tor = ["dep:ephem-tor", "dep:ephem-channel-web", "dep:futures", "dep:tracing"]

[dependencies]
ephem-tor = { path = "../tor", default-features = false, optional = true }
ephem-channel-web = { path = "../channel-web", optional = true }
futures = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
ephem-proto = { path = "../proto" }
ephem-crypto = { path = "../crypto" }
ephem-core = { path = "../core" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.9", default-features = false }
zeroize = "1"
web-sys = { version = "0.3", features = [
  "Window",
  "RtcConfiguration",
  "RtcIceServer",
  "RtcBundlePolicy",
  "RtcIceTransportPolicy",
  "RtcPeerConnection",
  "RtcPeerConnectionState",
  "RtcIceConnectionState",
  "RtcDataChannelState",
  "RtcOfferOptions",
  "RtcIceGatheringState",
  "RtcPeerConnectionIceEvent",
  "RtcIceCandidate",
  "RtcDataChannel",
  "RtcDataChannelInit",
  "RtcDataChannelType",
  "RtcSdpType",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
  "MessageEvent",
] }
