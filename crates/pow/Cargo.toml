[package]
name = "ephem-pow"
description = "Ephem boards' proof-of-work solver for Web Workers (app/pkg/ephem_pow.wasm): a raw wasm ABI, no JavaScript glue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ephem-board = { path = "../board", default-features = false }
equix = { version = "=0.7.0", default-features = false }
