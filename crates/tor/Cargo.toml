[package]
name = "ephem-tor"
description = "Ephem Tor mode (tor_bg.wasm): arti in the browser over Snowflake, onion services (docs/P2P-CHAT.md §28, Appendix C.5)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The JS API of the lab page (TorNet, TorStream). The Ephem app build uses the Rust API only.
default = ["js-api"]
js-api = []

[dependencies]
ephem-snowflake = { path = "../snowflake" }
arti-client = { version = "0.46", default-features = false, features = ["onion-service-client", "onion-service-service", "ephemeral-keystore", "bridge-client", "keymgr", "experimental-api"] }
tor-rtcompat = { version = "0.46", default-features = false }
futures = "0.3"
tor-general-addr = "0.46"
tor-hscrypto = "0.46"
tor-hsservice = "0.46"
tor-llcrypto = "0.46"
tor-proto = "0.46"
tor-cell = "0.46"
safelog = "0.9"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }
async-trait = "0.1"
toml = "0.8"
tracing = "0.1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "RequestMode", "Response", "Headers", "RtcConfiguration", "RtcIceServer", "RtcPeerConnection", "RtcPeerConnectionState", "RtcIceGatheringState", "RtcDataChannel", "RtcDataChannelInit", "RtcDataChannelType", "RtcDataChannelState", "RtcSdpType", "RtcSessionDescription", "RtcSessionDescriptionInit", "MessageEvent", "console"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1", features = ["web"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# The in-memory directory cache (vendored patch) and its snapshots for warm starts.
tor-dirmgr = { version = "0.46", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
getrandom03 = { package = "getrandom", version = "0.3" }
tor-rtcompat = { version = "0.46", features = ["tokio", "rustls"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Native lab tests link SQLite statically (the browser build has none, see vendor/README.md).
tor-dirmgr = { version = "0.46", features = ["static"] }
