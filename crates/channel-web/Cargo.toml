[package]
name = "ephem-channel-web"
description = "Ephem public channels in the browser (part of the Tor build): owner, onion gateway, reader, mirrors"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ephem-channel = { path = "../channel" }
ephem-crypto = { path = "../crypto" }
ephem-tor = { path = "../tor", default-features = false }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures = "0.3"
tracing = "0.1"
zeroize = "1"
ed25519-dalek = { version = "2", default-features = false }
# IPNS publishing through a Tor exit (§D.5.2): HTTPS to delegated-ipfs.dev, verified against the
# Mozilla root store (pure Rust: rustls with ring, as the Tor link already uses).
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"
